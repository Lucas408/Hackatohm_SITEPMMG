<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Policiamento Inteligente</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Layout: cabeçalho institucional azul-marinho + menu horizontal fixo; conteúdo em cartões arredondados sobre fundo claro */
:root{
  --navy:#10243A; --navy2:#173F67; --blue:#2F6FA3; --gold:#C6A45A;
  --bg:#F4F6F9; --surface:#FFFFFF; --text:#202B38; --muted:#687587; --soft:#F7F9FC;
  --line:#E1E7EE; --line2:#ECF0F5; --track:#E6ECF2; --blue-soft:#EAF2F9; --gold-soft:#F6ECD3;
  --peak:#8A6A1F; --red:#B5372E; --red-soft:#FBE9E7;
  --ink:#10243A; --brown:#8FB0D0; --brown-d:#687587; --brown-t:#3D4B5C; --cream:#FFFFFF;
  --sh:0 1px 2px rgba(16,36,58,.05),0 8px 24px rgba(16,36,58,.06);
  --f-disp:'Manrope','Inter',system-ui,sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--navy)}
[hidden]{display:none!important}
.menu .mi.hl{background:linear-gradient(135deg,#F4B41A,#E3A112);color:var(--navy);box-shadow:0 2px 8px rgba(227,161,18,.35)}
.menu .mi.hl .ic{color:var(--navy)}
.menu .mi.hl:hover{filter:brightness(1.06);background:linear-gradient(135deg,#F4B41A,#E3A112)}
.menu .mi.hl[aria-current="page"]{background:var(--navy);color:#fff;box-shadow:inset 0 -3px 0 #F4B41A}
.menu .mi.hl[aria-current="page"] .ic{color:#F4B41A}
.dz{border:2px dashed #B9C9DA;border-radius:16px;padding:30px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--soft);text-align:center;color:var(--muted);transition:background-color .15s,border-color .15s}
.dz.on{border-color:var(--blue);background:var(--blue-soft)}
.dz .ic{color:var(--blue)}
.lst{margin:0;padding-left:20px;font-size:13.5px;display:grid;gap:4px}
.lst.e{color:var(--red)}.lst.w{color:var(--peak)}
.mapg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.mapg .fld select{width:100%;min-width:0}

/* ---- Login e painel operacional (demonstração) ---- */
.lgn{--nv:#1D4A7A;--gd:#AC924C;--gd2:#C6A14F;position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:28px 24px;background:#E4E9E8;overflow:auto}
.lgn *{box-sizing:border-box}
.lgn .bgs{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.lgn .shell{position:relative;width:100%;max-width:1230px;margin:auto;display:grid;grid-template-columns:1.25fr 1fr;background:#FBFCFC;border:1px solid rgba(255,255,255,.9);border-radius:22px;overflow:hidden;box-shadow:0 2px 6px rgba(29,74,122,.06),0 30px 70px rgba(29,74,122,.16)}
.lgn .left{padding:clamp(28px,5.5vw,64px);display:flex;flex-direction:column;gap:12px;min-width:0}
.lgn .logos{display:flex;align-items:center;gap:22px;margin-bottom:18px}
.lgn .logos img{height:clamp(52px,6vw,80px);width:auto;display:block}
.lgn .logos .dv{width:1px;height:clamp(40px,5vw,56px);background:#CBD3DB}
.lgn .eyebrow{font:700 14px var(--f-disp);letter-spacing:.16em;text-transform:uppercase;color:var(--gd)}
.lgn h2{margin:0;font:800 clamp(34px,4.2vw,50px)/1.04 var(--f-disp);color:var(--nv);letter-spacing:-.02em}
.lgn .sub{margin:4px 0 16px;color:#4B5C70;font-size:16.5px;line-height:1.5;max-width:520px}
.lgn .box{background:#fff;border:1px solid #E6ECF3;border-radius:18px;padding:22px 24px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(29,74,122,.05),0 10px 30px rgba(29,74,122,.08)}
.lgn .fld{display:flex;flex-direction:column;gap:8px}
.lgn .fld label{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;color:var(--nv)}
.lgn .badge{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:#E1E8EE;color:var(--nv);display:flex;align-items:center;justify-content:center}
.lgn .inp{position:relative}
.lgn .inp>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#8794A3;pointer-events:none}
.lgn .inp input{width:100%;min-width:0;min-height:50px;padding:0 46px 0 44px;border:1.5px solid #DDE4EC;border-radius:12px;background:#F5F8FA;font-size:15px;transition:border-color .15s,box-shadow .15s,background-color .15s}
.lgn .inp input:hover{border-color:#B9C7D6}
.lgn .inp input:focus{outline:0;border-color:var(--nv);background:#fff;box-shadow:0 0 0 4px rgba(29,74,122,.14)}
.lgn .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:transparent;border-radius:10px;color:var(--nv);display:flex;align-items:center;justify-content:center}
.lgn .eye:hover{background:#E9EFF5}
.lgn .err{display:flex;align-items:center;gap:8px;color:#B3261E;background:#FDE8E5;border-radius:11px;padding:10px 12px;font-size:13.5px;font-weight:600}
.lgn .err:empty{display:none}
.lgn .go{min-height:52px;border:0;border-radius:999px;background:var(--nv);color:#fff;font:700 15.5px var(--f-disp);display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 18px rgba(29,74,122,.28)}
.lgn .go:hover{filter:brightness(1.12);transform:translateY(-1px)}
.lgn .hint{display:flex;gap:12px;font-size:13px;line-height:1.55;color:#5B4A1E;background:linear-gradient(135deg,#FBF2DC,#F8EBCB);border-radius:12px;padding:14px 16px}
.lgn .hint .ex{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--gd2);color:#fff;font:800 14px/24px var(--f-disp);text-align:center}
.lgn .art{position:relative;min-height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#C4DAE3 0%,#C4DAE3 14%,#708283 100%)}
.lgn .art img{display:block;width:100%;height:auto;max-height:100%;object-fit:contain;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 5%,#000 94%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 5%,#000 94%,transparent 100%)}
@media (max-width:900px){.lgn{padding:12px}.lgn .shell{grid-template-columns:1fr}.lgn .art{order:-1;min-height:0;height:min(420px,100vw);padding:0}.lgn .art img{width:auto;height:100%}.lgn .left{padding:24px 20px}.lgn .logos img{height:48px}.lgn .box{padding:18px}}
/* Login: o cartão se adapta à altura da janela (zoom 100%) sem precisar rolar a página */
@media (min-width:901px){
.lgn{padding:clamp(10px,2.4vh,28px) 24px}
.lgn .shell{height:100%;max-height:900px;min-height:540px}
.lgn .left{padding:clamp(14px,3.6vh,64px) clamp(28px,5.5vw,64px);gap:clamp(4px,1.1vh,12px);justify-content:center}
.lgn .logos{margin-bottom:clamp(0px,1.2vh,18px)}
.lgn .logos img{height:clamp(32px,min(6vw,8vh),80px)}
.lgn .logos .dv{height:clamp(24px,min(5vw,5.2vh),56px)}
.lgn .eyebrow{font-size:clamp(11px,1.5vh,14px)}
.lgn h2{font-size:clamp(26px,min(4.2vw,5.9vh),50px)}
.lgn .sub{margin:0 0 clamp(2px,1.4vh,16px);font-size:clamp(13px,1.9vh,16.5px);line-height:1.4}
.lgn .box{padding:clamp(10px,2vh,22px) 24px clamp(10px,2.2vh,24px);gap:clamp(6px,1.3vh,14px)}
.lgn .fld{gap:clamp(3px,.8vh,8px)}
.lgn .fld label{font-size:clamp(12.5px,1.7vh,13.5px)}
.lgn .badge{width:clamp(24px,3.4vh,32px);height:clamp(24px,3.4vh,32px)}
.lgn .inp input{min-height:clamp(38px,5.4vh,50px)}
.lgn .go{min-height:clamp(40px,5.4vh,52px)}
.lgn .err{padding:clamp(6px,1vh,10px) 12px}
.lgn .hint{padding:clamp(7px,1.4vh,14px) 16px;font-size:clamp(11px,1.5vh,13px);line-height:1.4;gap:10px}
.lgn .hint .ex{width:clamp(20px,2.8vh,24px);height:clamp(20px,2.8vh,24px);line-height:clamp(20px,2.8vh,24px)}
.lgn .art{min-height:0;overflow:hidden}
.lgn .art img{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:cover;object-position:center 42%}
}
@media (min-width:901px) and (max-height:640px){.lgn .shell{grid-template-columns:1.55fr 1fr}.lgn .art img{object-position:center 50%}}
.pk{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.pk li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.pk li span:first-child{color:var(--muted)} .pk li b{text-align:right}
.ptb{width:100%;border-collapse:collapse;font-size:14px}
.ptb th{text-align:left;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line)}
.ptb td{padding:10px;border-bottom:1px solid var(--line2)}
.ptb tr.me td{background:var(--gold-soft);font-weight:600}
.pt2{overflow-x:auto}
.note{font-size:13px;color:var(--peak);background:var(--gold-soft);border-radius:12px;padding:10px 14px}

button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(47,111,163,.45);outline-offset:2px}
.hv{transition:filter .15s,background-color .15s,transform .15s}
.hv:hover{filter:brightness(1.1)}

.app{display:flex;flex-direction:column;min-height:100vh}
.wrap{width:100%;max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:901px){.wrap{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}

/* Cabeçalho institucional */
.top1{background:var(--navy);box-shadow:inset 0 -3px 0 var(--gold);color:#fff}
.top1in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 28px;padding-block:16px 19px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.mark{flex:0 0 auto;width:46px;height:46px;border-radius:13px;background:var(--navy2);display:flex;align-items:center;justify-content:center;border:1px solid rgba(198,164,90,.45)}
.brand b{display:block;font:800 21px/1.15 var(--f-disp);letter-spacing:-.01em}
.brand small{display:block;margin-top:2px;font-size:12.5px;line-height:1.35;color:#B7C6D8}
.partners{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.partners .k{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#9FB4CB}
.plogos{display:flex;align-items:center;gap:14px;background:#fff;border-radius:14px;padding:6px 16px}
.plogos .sep{width:1px;height:32px;background:var(--line)}
.logo{display:flex;align-items:center;height:48px}
.logo img{display:block;max-height:48px;max-width:140px}

/* Menu horizontal */
.top2{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 4px 16px rgba(16,36,58,.06)}
.menu{display:flex;flex-wrap:wrap;gap:6px;padding-block:8px}
.menu .mi[data-act="logout"]{flex:0 0 auto}
.menu::-webkit-scrollbar{display:none}
.mi{flex:1 1 auto;justify-content:center;display:flex;align-items:center;gap:9px;min-height:44px;padding:0 15px;border:0;border-radius:11px;background:transparent;color:var(--text);font-weight:600;font-size:14.5px;white-space:nowrap}
.mi svg{flex:0 0 auto}
.mi .ic{color:var(--blue)}
.mi:hover{background:var(--blue-soft)}
.mi[aria-current="page"]{background:var(--navy);color:#fff}
.mi[aria-current="page"] .ic{color:var(--gold)}
.mi .chev{margin-left:-2px;opacity:.7;transition:transform .15s}
.mi[aria-expanded="true"] .chev{transform:rotate(180deg)}
.submenu{position:fixed;z-index:80;min-width:290px;max-width:calc(100vw - 16px);background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 16px 40px rgba(16,36,58,.18)}
.si{display:flex;flex-direction:column;width:100%;gap:1px;padding:10px 14px;border:0;border-radius:10px;background:transparent;text-align:left}
.si:hover{background:var(--blue-soft)}
.si .sit{font-weight:600;font-size:14.5px}
.si .sid{font-size:12.5px;color:var(--muted)}
.si[aria-current="page"]{background:var(--navy);color:#fff}
.si[aria-current="page"] .sid{color:#B7C6D8}

/* Cabeçalho da página */
.main{flex:1 1 auto;display:flex;flex-direction:column}
.pagehead{padding-block:28px 6px}
.eb{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
.pagehead h1{margin:6px 0 0;font:800 32px/1.15 var(--f-disp);letter-spacing:-.02em;color:var(--navy);text-wrap:balance}
.pagehead p{margin:8px 0 0;font-size:15.5px;color:var(--muted);max-width:68ch}
.chip{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:5px 12px;border-radius:999px;background:var(--gold-soft);color:var(--peak);font-size:12px;font-weight:600}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--gold)}
.pad{display:flex;flex-direction:column;gap:20px;padding-block:20px 36px}
.foot{background:var(--surface);border-top:1px solid var(--line)}
.footin{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;padding-block:16px;font-size:12.5px;line-height:1.5;color:var(--muted)}
.footin .m{color:#8794A5}

/* Cartões e textos */
.row{display:flex;flex-wrap:wrap;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:18px;min-width:0;box-shadow:var(--sh)}
.ct{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px 16px}
.h2{margin:0;font:700 18px/1.25 var(--f-disp);letter-spacing:-.01em;color:var(--navy)}
.sub{font-size:13.5px;color:var(--muted);margin-top:3px}
.lab{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.insight{margin:0;font-size:15px;line-height:1.55;color:var(--brown-t)}
.insight b{color:var(--navy)}
.empty{padding:22px;text-align:center;color:var(--muted);background:var(--soft);border:1px dashed #C9D6E3;border-radius:12px;font-size:14px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--sh)}
.kh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ico{flex:0 0 auto;width:38px;height:38px;border-radius:11px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center}
.kpi .big{font:800 40px/1.1 var(--f-disp);letter-spacing:-.02em;color:var(--navy);font-variant-numeric:tabular-nums}
.kpi .unit{font:600 17px var(--f-disp);color:var(--muted)}
.kpi .b{font-size:13.5px;font-weight:600}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.dark{background:var(--navy);border-color:var(--navy);color:#fff;flex-direction:row;align-items:center;gap:18px}
.kpi.dark .lab{color:#9FB4CB}

/* Controles */
.pills{display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--bg);border-radius:13px;align-self:flex-start}
.pill{min-height:40px;padding:0 16px;border:0;border-radius:10px;background:transparent;color:var(--brown-t);font-weight:600;font-size:13.5px}
.pill:hover{background:#E7EDF4}
.pill[aria-pressed="true"]{background:var(--navy);color:#fff;box-shadow:0 2px 6px rgba(16,36,58,.25)}
.btn{min-height:44px;padding:0 20px;border:0;border-radius:11px;background:var(--navy);color:#fff;font-weight:600;font-size:14px}
.btn.red{background:var(--blue);color:#fff}
.btn.ghost{background:#fff;color:var(--navy2);border:1px solid #C9D6E3}
.btn.ghost:hover{background:var(--blue-soft)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.ctl{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label{font-size:12.5px;font-weight:600;color:var(--brown-t)}
.fld select,.fld input{min-height:44px;padding:0 14px;border:1px solid #D3DCE6;background:#fff;border-radius:11px;min-width:170px;max-width:100%}
.fld select:hover,.fld input:hover{border-color:#B5C5D6}
.msg{font-size:13.5px;font-weight:600;min-height:20px;color:var(--navy2)}
.msg.err{color:var(--red)}

/* Tabelas */
.scroll{overflow-x:auto;border-radius:12px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
.tbl th{text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:11px 14px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th.r,.tbl td.r{text-align:right}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums;vertical-align:middle}
.tbl tbody tr:hover td{background:#FAFBFD}
.tbl tr.tot td{border-top:2px solid var(--navy);border-bottom:0;font-weight:700;background:var(--soft)}
.mono{font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums}
.pager{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;color:var(--muted)}
.csv{background:var(--navy);color:#D6E2EF;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;padding:16px;max-height:200px;overflow:auto;white-space:pre;border-radius:12px}

/* Barras, status e etiquetas */
.rr{display:grid;grid-template-columns:118px minmax(0,1fr) 78px 98px;gap:8px 16px;align-items:center;padding:12px 0;border-top:1px solid var(--line2)}
.rr .nm{font-weight:600;font-size:14.5px}
.trk{height:10px;background:var(--track);border-radius:999px;position:relative;overflow:hidden}
.trk i{position:absolute;left:0;top:0;bottom:0;display:block;border-radius:999px}
.tag{display:inline-block;text-align:center;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--blue-soft);color:var(--navy2)}
.tag.at{background:var(--gold-soft);color:var(--peak)}
.tag.cr{background:var(--red-soft);color:#9C2B22}
.st{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.st.pat{background:var(--navy);color:#fff}
.st.oco{background:var(--blue);color:#fff}
.st.disp{background:var(--gold-soft);color:var(--peak);border:1px solid #E3D2A6}
.st.man{border:1px dashed #98A6B8;color:var(--muted)}
.rk{display:grid;grid-template-columns:24px 110px minmax(0,1fr) 56px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line2)}
.sg{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 16px;padding:14px 16px;background:var(--soft);border:1px solid var(--line);border-radius:12px}
.sg .tx{flex:1 1 220px;min-width:0}
.sg b{font-size:15px;color:var(--navy)}
.sg p{margin:2px 0 0;font-size:13.5px;color:var(--brown-t)}
.lg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted)}
.lg span{display:flex;align-items:center;gap:7px}
.lg i{width:12px;height:12px;display:inline-block;border-radius:3px}

/* Mapa de demanda */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;border-radius:14px;aspect-ratio:1/.8}
.tile .tn{font-size:13px;font-weight:600;line-height:1.25}
.tile .tv{font:800 32px/1 var(--f-disp);letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* Gráfico de ocorrências */
.cw{display:grid;grid-template-columns:46px minmax(0,1fr);column-gap:8px}
.yax{position:relative;height:300px}
.yax span{position:absolute;right:0;transform:translateY(50%);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pl{position:relative;height:300px;border-bottom:1px solid #B7C4D3;border-left:1px solid var(--line)}
.gl{position:absolute;left:0;right:0;border-top:1px solid var(--line2)}
.pl svg{position:absolute;inset:0;width:100%;height:100%}
.avgl{position:absolute;left:0;right:0;border-top:2px dashed var(--navy2);opacity:.7;z-index:1}
.dot{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--blue);transform:translate(-50%,50%);padding:0;z-index:3;transition:background-color .15s}
.dot:hover,.dot:focus-visible{background:var(--blue)}
.dot.pk{width:22px;height:22px;background:var(--gold);border-color:#fff;box-shadow:0 0 0 3px var(--gold)}
.dot.mn{border-color:var(--navy)}
.dot .tip{display:none;position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 13px;border-radius:10px;font:500 12px/1.4 var(--f-body);white-space:nowrap;text-align:left;pointer-events:none;z-index:6;box-shadow:0 8px 20px rgba(16,36,58,.3)}
.dot .tip b{display:block;font:800 20px/1.15 var(--f-disp)}
.dot .tip em{display:block;font-style:normal;color:#C9D8E8;font-size:11.5px}
.dot:hover .tip,.dot:focus-visible .tip{display:block}
.dot.tl .tip{left:-6px;transform:none}
.dot.tr .tip{left:auto;right:-6px;transform:none}
.dv{position:absolute;transform:translateX(-50%);font-size:12px;font-weight:500;color:var(--brown-t);z-index:2;pointer-events:none;font-variant-numeric:tabular-nums}
.dv.pk{color:var(--peak);font-size:13px;font-weight:700}
.xr{display:grid;margin-top:8px}
.xr span{text-align:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.scs{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px}
.sc{background:var(--soft);border:1px solid var(--line2);border-radius:13px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.sc .v{font:800 28px/1.1 var(--f-disp);letter-spacing:-.02em;color:var(--navy);font-variant-numeric:tabular-nums}
.sc .n{font-size:12.5px;color:var(--muted)}
.itl{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:12px}
.it{background:var(--soft);border:1px solid var(--line2);border-radius:13px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.it.pk{border-color:var(--gold);background:#FFFDF7}
.it .v{font:800 24px/1.1 var(--f-disp);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.it .d{font-size:12px;font-weight:500}

/* Alertas e atalhos do Dashboard */
.al{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line2)}
.aldot{flex:0 0 auto;width:10px;height:10px;border-radius:50%}
.aldot.cr{background:var(--red)}
.aldot.at{background:var(--gold)}
.alt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.alt b{font-size:14.5px}
.alt span{font-size:12.5px;color:var(--muted)}
.shortcuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.sct{display:flex;align-items:center;gap:14px;padding:16px 18px;background:#fff;border:1px solid var(--line);border-radius:14px;text-align:left;box-shadow:var(--sh);transition:transform .15s,border-color .15s,box-shadow .15s}
.sct:hover{transform:translateY(-2px);border-color:#9DBBD6;box-shadow:0 10px 26px rgba(16,36,58,.1)}
.sctt{display:flex;flex-direction:column;min-width:0;flex:1 1 auto}
.sctt b{font-size:14.5px;color:var(--navy)}
.sctt span{font-size:12.5px;color:var(--muted)}
.sct .arr{color:#9FB0C3;flex:0 0 auto}

@media (max-width:900px){
  .pagehead h1{font-size:28px}
  .top1in{padding-block:14px 17px}
  .brand b{font-size:19px}
}
@media (max-width:560px){
  .rr{grid-template-columns:minmax(0,1fr) auto}
  .rr .trk{grid-column:1/-1;order:3}
  .kpi .big{font-size:36px}
  .card{padding:18px}
  .tile{padding:10px 12px}
  .tile .tv{font-size:24px}
  .tile .tn{font-size:12px}
  .rk{grid-template-columns:22px 92px minmax(0,1fr) 50px;gap:8px}
  .yax,.pl{height:260px}
  .cw{grid-template-columns:38px minmax(0,1fr);column-gap:6px}
  .xr.dense span:nth-child(even){visibility:hidden}
  .dot .tip{font-size:11.5px}
  .partners .k{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
.plgrid{display:grid;grid-template-columns:minmax(0,2.7fr) minmax(330px,1.3fr);gap:22px;align-items:start}
.plmapc{display:flex;flex-direction:column;gap:12px;min-width:0}
.plside{display:flex;flex-direction:column;gap:20px;min-width:0}
.lg2{display:flex;flex-wrap:wrap;gap:10px 28px;padding:12px 14px;background:var(--soft);border:1px solid var(--line2);border-radius:12px}
.lgg{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.lgg .lab{font-size:10.5px}
.lgi{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.lgi i{width:14px;height:14px;border-radius:4px;display:inline-block}
.vlist{display:flex;flex-direction:column;gap:6px}
.vli{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);cursor:pointer}
.vli:hover{border-color:#B5C5D6;background:var(--soft)}
.vli.on{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy);background:var(--blue-soft)}
.vdot{width:30px;height:30px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.vtx{display:flex;flex-direction:column;min-width:0;font-size:12.5px;color:var(--muted)}
.vtx b{font-size:14px;color:var(--navy)}
.vkm{font-weight:700;font-size:13px;text-align:right;color:var(--navy);display:flex;flex-direction:column}
.vkm small{font-weight:500;font-size:11px;color:var(--muted)}
.vsw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:0}
.vsw.sq{width:12px;height:12px;border-radius:3px;margin-right:8px}
.cbar{height:6px;border-radius:4px;background:var(--track);margin-bottom:5px;max-width:220px;overflow:hidden}
.cbar i{display:block;height:100%;background:var(--blue)}
.hero{display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,2.4fr);background:linear-gradient(135deg,#10243A 0%,#173F67 100%);color:#fff;border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.hero-l{padding:28px 30px;display:flex;flex-direction:column;gap:8px;background:rgba(0,0,0,.14);border-right:1px solid rgba(255,255,255,.12)}
.hero-r{padding:28px 32px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hero-eb{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#C6A45A}
.hero-v{font:800 clamp(36px,5vw,52px)/1 var(--f-disp);letter-spacing:-.01em}
.hero-s{font-size:13.5px;color:#B8C7D8}
.hero-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.hero-f{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.hero-ph{font:800 clamp(26px,3.4vw,36px)/1.1 var(--f-disp)}
.hero-rem{font-size:14px;color:#F1D9A0;font-weight:600}
.hero-t{margin:0;font-size:15.5px;line-height:1.55;color:#E6EDF5;max-width:62ch}
.hero-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14)}
.hero-g span{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#9FB3C8;margin-bottom:2px}
.hero-g b{font-size:15px}
.hero-g a{color:#fff;text-decoration:underline;text-decoration-color:#C6A45A;text-underline-offset:3px}
.hero-b{display:flex;flex-wrap:wrap;gap:10px;margin-top:2px}
.hero .btn.hero-gh{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
.hero .btn.hero-gh:hover{background:rgba(255,255,255,.1)}
.tlist{display:flex;flex-direction:column;gap:8px}
.tli{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);cursor:pointer}
.tli:hover{border-color:#B5C5D6;background:var(--soft)}
.tlh{font:800 17px var(--f-disp);color:var(--navy)}
.tlb{display:flex;flex-direction:column;font-size:12.5px;color:var(--muted);min-width:0}
.tlb b{font-size:14px;color:var(--text)}
.strip{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:4px;align-items:end;height:92px}
.sc{display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;gap:4px;height:100%;padding:0;border:0;background:transparent;cursor:pointer;border-radius:6px}
.sc i{display:block;border-radius:5px 5px 2px 2px;min-height:8px}
.sc span{font-size:10.5px;color:var(--muted);text-align:center}
.sc.now{background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold)}
.sc.now span{color:var(--peak);font-weight:700}
.sc:hover i{filter:brightness(1.15)}
@media (max-width:900px){.plgrid{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.hero-l{border-right:0;border-bottom:1px solid rgba(255,255,255,.12)}.hero-l,.hero-r{padding:22px}}
@media (max-width:900px){.strip{grid-template-columns:repeat(24,34px);overflow-x:auto;padding-bottom:6px}}
@media (min-width:901px){.menu{gap:2px;flex-wrap:nowrap}.mi{padding:0 9px;gap:6px;font-size:13.5px;white-space:nowrap}}
.vli.un{opacity:.7;cursor:default;background:var(--soft)}.vli.un:hover{border-color:var(--line);background:var(--soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

  return '<div style="display:flex;align-items:flex-end;gap:'+g+'px;height:250px;padding:4px 4px 0;border-bottom:1px solid var(--line)">'+p.values.map(function(v,k){var pk=k===T.pk;return '<div style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px" title="'+esc(p.full[k])+': '+fmt(v)+' ocorrências"><span style="font:700 '+fs+'px var(--f-disp);color:'+(pk?'var(--peak)':'var(--muted)')+'">'+fmt(v)+'</span><div style="width:100%;max-width:64px;height:'+(v/mx*78).toFixed(1)+'%;min-height:4px;border-radius:8px 8px 0 0;background:'+(pk?'var(--gold)':'var(--blue)')+'"></div></div>'}).join('')+'</div><div style="display:flex;gap:'+g+'px;padding:8px 4px 0">'+p.labels.map(function(l){return '<span style="flex:1 1 0;min-width:0;text-align:center;font-size:'+(n>8?11:12.5)+'px;color:var(--muted)">'+esc(l)+'</span>'}).join('')+'</div>'}
function smooth(pts){
  var d='M'+pts[0][0].toFixed(2)+','+pts[0][1].toFixed(2),t=0.18,i;
  for(i=0;i<pts.length-1;i++){
    var p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    var c1=[p1[0]+(p2[0]-p0[0])*t,p1[1]+(p2[1]-p0[1])*t],c2=[p2[0]-(p3[0]-p1[0])*t,p2[1]-(p3[1]-p1[1])*t];
    d+=' C'+c1[0].toFixed(2)+','+c1[1].toFixed(2)+' '+c2[0].toFixed(2)+','+c2[1].toFixed(2)+' '+p2[0].toFixed(2)+','+p2[1].toFixed(2);
  }
  return d;
}
function chartHTML(p){
  if(p.bars)return barsHTML(p);
  var T=periodStats(p),vals=T.vals,n=T.n,i;
  var raw=T.mx*1.06/4,pw=Math.pow(10,Math.floor(Math.log10(raw))),steps=[1,1.5,2,2.5,3,4,5,6,8,10],step=pw*10;
  for(i=0;i<steps.length;i++){if(steps[i]*pw>=raw){step=steps[i]*pw;break}}
  var NM=step*4;
  var pts=vals.map(function(v,k){return [(k+.5)/n*100,100-v/NM*100]});
  var line=smooth(pts),area=line+' L'+pts[n-1][0].toFixed(2)+',100 L'+pts[0][0].toFixed(2)+',100 Z';
  var grid='',yl='';
  for(i=0;i<=4;i++){grid+='<div class="gl" style="bottom:'+(i*25)+'%"></div>';yl+='<span style="bottom:'+(i*25)+'%">'+fmt(step*i)+'</span>'}
  var dots=vals.map(function(v,k){
    var x=(k+.5)/n*100,y=v/NM*100,cls=k===T.pk?' pk':k===T.lo?' mn':'',al=x>80?' tr':x<20?' tl':'';
    var d=k>0?(v/vals[k-1]-1)*100:null,showV=n<=8||k===T.pk||k===T.lo;
    return '<button type="button" class="dot'+cls+al+'" style="left:'+x.toFixed(2)+'%;bottom:'+y.toFixed(2)+'%" aria-label="'+esc(p.labels[k])+': '+fmt(v)+' ocorrências"><span class="tip">'+esc(p.labels[k])+'<b>'+fmt(v)+'</b>'+(d===null?'':'<em>'+(d>0?'▲ ':'▼ ')+d1(Math.abs(d))+'% sobre o anterior</em>')+'</span></button>'+
      (showV?'<span class="dv'+(k===T.pk?' pk':'')+'" style="left:'+x.toFixed(2)+'%;bottom:calc('+y.toFixed(2)+'% + '+(k===T.pk?20:14)+'px)">'+fmt(v)+'</span>':'');
  }).join('');
  var xr='<div class="xr'+(n>8?' dense':'')+'" style="grid-template-columns:repeat('+n+',minmax(0,1fr))">'+p.labels.map(function(l){return '<span>'+esc(l)+'</span>'}).join('')+'</div>';
  return '<div><div class="cw"><div class="yax" aria-hidden="true">'+yl+'</div><div class="pl">'+grid+
    '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F6FA3" stop-opacity=".30"/><stop offset="1" stop-color="#2F6FA3" stop-opacity=".02"/></linearGradient></defs><path d="'+area+'" fill="url(#ag)"/><path d="'+line+'" fill="none" stroke="#2F6FA3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>'+
    '<div class="avgl" style="bottom:'+(T.avg/NM*100).toFixed(2)+'%"></div>'+dots+'</div><div></div>'+xr+'</div>'+
    '<div class="lg" style="margin-top:14px"><span><i style="background:#fff;border:3px solid var(--blue);border-radius:50%"></i>Total de cada intervalo</span><span><i style="background:var(--gold);border-radius:50%"></i>Maior volume</span><span><i style="background:#fff;border:3px solid var(--ink);border-radius:50%"></i>Menor volume</span><span><i style="width:18px;height:0;border-top:2px dashed var(--ink)"></i>Média do período: '+fmt(T.avg)+'</span></div></div>';
}
function insightHTML(p){var T=periodStats(p);return '<p class="insight">O maior volume foi em <b>'+esc(p.labels[T.pk])+'</b> ('+fmt(T.mx)+' ocorrências) e o menor em <b>'+esc(p.labels[T.lo])+'</b> ('+fmt(T.mn)+'). A média é de <b>'+fmt(T.avg)+'</b> '+UNIT[state.period]+'.</p>'}
function statsHTML(p){
  var T=periodStats(p),up=p.delta>0;
  function c(l,v,n,col){return '<div class="sc"><div class="lab">'+l+'</div><div class="v"'+(col?' style="color:'+col+'"':'')+'>'+v+'</div><div class="n">'+n+'</div></div>'}
  return '<div class="scs">'+c('Total no período',fmt(T.total),p.label)+c('Média',fmt(T.avg),UNIT[state.period])+c('Maior volume',fmt(T.mx),esc(p.labels[T.pk]),'var(--peak)')+c('Menor volume',fmt(T.mn),esc(p.labels[T.lo]))+c('Variação',p.nd?'—':(up?'▲ ':'▼ ')+d1(Math.abs(p.delta))+'%',p.nd?'sem período anterior na base':'sobre o período anterior',up?'var(--red)':'var(--ink)')+'</div>';
}
function tilesHTML(p){
  var T=periodStats(p);
  return '<div class="itl">'+p.values.map(function(v,k){var d=k>0?(v/p.values[k-1]-1)*100:null,pk=k===T.pk;
    return '<div class="it'+(pk?' pk':'')+'"><div class="lab">'+esc(p.labels[k])+'</div><div class="v"'+(pk?' style="color:var(--peak)"':'')+'>'+fmt(v)+'</div><div class="trk"><i style="width:'+(v/T.mx*100).toFixed(1)+'%;background:'+(pk?'var(--gold)':'var(--brown)')+'"></i></div><div class="d" style="color:'+(d===null?'var(--brown-d)':d>0?'var(--red)':'var(--ink)')+'">'+(d===null?'início do período':(d>0?'▲ ':'▼ ')+d1(Math.abs(d))+'%')+'</div></div>'}).join('')+'</div>';
}
function covList(){return regs().list.map(function(r){var pc=Math.round(r.alloc/r.est*100);return {r:r,pc:pc,st:statusOf(pc)}}).sort(function(a,b){return a.pc-b.pc})}
function covCounts(){var c={ok:0,at:0,cr:0};covList().forEach(function(o){c[o.st[1]]++});return c}

function vOcorr(){
  var p=PER[state.period];
  return '<section class="card">'+ct('Ocorrências por período',p.sub,pillsHTML())+insightHTML(p)+chartHTML(p)+'</section>'+
  '<section class="card">'+ct('Dados por intervalo','Total de cada intervalo e variação sobre o intervalo anterior')+statsHTML(p)+tilesHTML(p)+'</section>';
}

function vCob(){
  var s=regs(),L=covList(),cc=covCounts(),cov=Math.round(s.alloc/s.est*100);
  var rows=L.map(function(o){return '<div class="rr"><div class="nm">'+o.r.n+'</div><div class="trk" style="height:14px"><i style="width:'+Math.min(100,o.pc)+'%;background:'+fillOf(o.st[1])+'"></i></div><div class="mono" style="text-align:right">'+o.r.alloc+' / '+o.r.est+'<br><span style="color:var(--brown-d)">'+o.pc+'%</span></div><div class="tag '+o.st[1]+'">'+o.st[0]+'</div></div>'}).join('');
  function k(l,v,n){return kpiHTML({l:l,v:v,s:n,i:{'Cobertura geral':'target','Adequadas':'check','Em atenção':'alert','Críticas':'alert'}[l]})}
  return '<section class="kpis">'+k('Cobertura geral',cov+'%',s.alloc+' de '+s.est+' viaturas estimadas')+k('Adequadas',cc.ok,'cobertura de 90% ou mais')+k('Em atenção',cc.at,'cobertura de 75% a 89%')+k('Críticas',cc.cr,'cobertura abaixo de 75%')+'</section>'+
  '<section class="card" style="gap:6px">'+ct('Cobertura por regional','Viaturas alocadas sobre a demanda estimada, da menor para a maior cobertura')+'<div>'+rows+'</div></section>';
}

/* ---------- 02 Mapa de demanda ---------- */
function vMapa(){
  var P=MAPP[state.mapP],rows=REG.map(function(r){return {r:r,v:P.t*shr(r,state.mapP)}}),vals=rows.map(function(o){return o.v}),
      mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),tot=vals.reduce(function(a,b){return a+b},0);
  var order=DB?REG.map(function(r){return r.n}):['Noroeste','Norte','Nordeste','Oeste','Centro','Leste','Sudoeste','Sul','Sudeste'];
  var tiles=order.map(function(n){var o=rows.filter(function(x){return x.r.n===n})[0],l=LV[lvl(o.v,mn,mx)];return '<div class="tile" style="background:'+l.bg+';color:'+l.fg+'"><div class="tn">'+n+'</div><div class="tv">'+fmt(o.v)+'</div></div>'}).join('');
  var legend='<div class="lg">'+LV.map(function(l,i){return '<span><i style="background:'+l.bg+';border:1px solid #C9D6E3"></i>'+l.n+'</span>'}).join('')+'</div>';
  var rank=rows.slice().sort(function(a,b){return b.v-a.v}).map(function(o,i){return '<div class="rk"><span class="mono" style="color:var(--brown-d)">'+(i+1)+'</span><span style="font-weight:600">'+o.r.n+'</span><div class="trk"><i style="width:'+(o.v/mx*100).toFixed(1)+'%;background:'+(i<3?'var(--navy2)':'var(--brown)')+'"></i></div><span class="mono" style="text-align:right">'+Math.round(o.v/tot*100)+'%</span></div>'}).join('');
  var sel='<div class="fld"><label for="mapP">Período</label><select id="mapP" data-bind="mapP">'+opts([['12m',MAPP['12m'].l],['6m',MAPP['6m'].l],['3m',MAPP['3m'].l]],state.mapP)+'</select></div>';
  return '<div class="row"><section class="card" style="flex:3 1 480px">'+ct('Ocorrências por regional','Esquema ilustrativo, sem escala geográfica · dados agregados',sel)+'<div class="tiles">'+tiles+'</div>'+legend+'</section>'+
   '<section class="card" style="flex:2 1 340px;gap:6px">'+ct('Maior concentração','Participação de cada regional no total')+'<div>'+rank+'</div></section></div>';
}

/* ---------- 03 Gestão de viaturas ---------- */
function vfilter(){return VEH.filter(function(v){return state.vst==='all'||v.st===state.vst})}
function vTable(){
  var f=vfilter(),per=10,pages=Math.max(1,Math.ceil(f.length/per));
  if(state.vpage>=pages)state.vpage=pages-1;
  var sl=f.slice(state.vpage*per,state.vpage*per+per);
  var body=sl.length?sl.map(function(v){return '<tr><td><b class="mono" style="font-size:13.5px">'+esc(v.id)+'</b></td><td>'+v.cat+'</td><td>'+dispOf(v.st)+'</td><td><span class="st '+ST[v.st]+'">'+v.st+'</span></td></tr>'}).join(''):'<tr><td colspan="4" style="padding:22px 12px;color:var(--brown-d)">Nenhuma viatura com esse status.</td></tr>';
  return '<div class="scroll"><table class="tbl"><thead><tr><th>ID interno</th><th>Categoria</th><th>Disponibilidade</th><th>Status operacional</th></tr></thead><tbody>'+body+'</tbody></table></div>'+
  '<div class="pager"><span>'+f.length+' viaturas · página '+(state.vpage+1)+' de '+pages+'</span><span style="display:flex;gap:8px"><button type="button" class="btn ghost hv" data-act="vpage" data-v="-1"'+(state.vpage===0?' disabled':'')+'>Anterior</button><button type="button" class="btn ghost hv" data-act="vpage" data-v="1"'+(state.vpage>=pages-1?' disabled':'')+'>Próxima</button></span></div>';
}

/* ---------- 04 Distribuição de recursos ---------- */
function vRecursos(){
  var s=regs(),maxE=Math.max.apply(null,s.list.map(function(r){return r.est})),res=reserve();
  var rows=s.list.map(function(r){var pc=Math.round(r.alloc/r.est*100),st=statusOf(pc);
    return '<div class="rr"><div class="nm">'+r.n+'</div><div style="height:16px;background:var(--track);border:1px solid #C9D6E3;position:relative;width:'+(r.est/maxE*100).toFixed(1)+'%"><div style="position:absolute;left:0;top:0;bottom:0;width:'+Math.min(100,r.alloc/r.est*100).toFixed(1)+'%;background:var(--ink)"></div></div><div class="mono" style="text-align:right">'+r.alloc+' / '+r.est+'</div><div class="tag '+st[1]+'">'+st[0]+'</div></div>'}).join('');
  var sg=sugg(),sgH=sg.length?sg.map(function(x){return '<div class="sg"><div class="tx"><b>'+x.n+'</b><p>Alocar '+x.q+' viatura'+(x.q>1?'s':'')+' da reserva. Déficit atual de '+x.d+'.</p></div><span class="st disp">Para análise</span></div>'}).join(''):'<div class="sub">Nenhuma realocação sugerida: a frota disponível é de '+VEH.length+' viaturas, todas em operação.</div>';

   '<section class="card" style="flex:2 1 340px">'+ct('Sugestões de alocação','Sem reserva: as '+VEH.length+' viaturas já estão em operação')+'<div style="display:flex;flex-direction:column;gap:10px">'+sgH+'</div><div class="lab" style="line-height:1.5">As sugestões apoiam a análise. A decisão é do comando.</div></section></div>';
}

/* ---------- 05 Relatórios ---------- */
function repRows(){
  var P=PER[state.repP],tot=P.values.reduce(function(a,b){return a+b},0);
  return regs().list.filter(function(r){return state.repReg==='all'||r.n===state.repReg}).map(function(r){
    var cur=Math.round(tot*shr(r,state.repP));return {k:r.n,cur:cur,prev:prv(r,state.repP,cur),al:r.alloc,est:r.est,av:r.av};
  });
}
function vRelatorios(){
  var rows=repRows();
  var T=rows.reduce(function(a,r){a.cur+=r.cur;a.prev+=r.prev;a.al+=r.al;a.est+=r.est;a.av+=r.av;return a},{cur:0,prev:0,al:0,est:0,av:0});
  function vr(c,p){if(!p)return '—';var v=(c/p-1)*100;return '<span style="color:'+(v>0?'var(--red)':'var(--ink)')+';font-weight:600">'+(v>0?'▲ ':'▼ ')+d1(Math.abs(v))+'%</span>'}
  var body=rows.map(function(r){var pc=Math.round(r.al/r.est*100),st=statusOf(pc);return '<tr><td><b>'+r.k+'</b></td><td class="r">'+fmt(r.cur)+'</td><td class="r">'+fmt(r.prev)+'</td><td class="r">'+vr(r.cur,r.prev)+'</td><td class="r"><span class="tag '+st[1]+'" style="display:inline-block;min-width:110px">'+pc+'% · '+st[0]+'</span></td><td class="r">'+r.av+'%</td></tr>'}).join('');
  var tot='<tr class="tot"><td>Total</td><td class="r">'+fmt(T.cur)+'</td><td class="r">'+fmt(T.prev)+'</td><td class="r">'+vr(T.cur,T.prev)+'</td><td class="r">'+Math.round(T.al/T.est*100)+'%</td><td class="r">'+Math.round(T.av/rows.length)+'%</td></tr>';
  var regOpts=[['all','Todas as regionais']].concat(REG.map(function(r){return [r.n,r.n]}));
  var ctl='<div class="ctl"><div class="fld"><label for="repP">Período</label><select id="repP" data-bind="repP">'+opts([['7d','Últimos 7 dias'],['30d','Últimos 30 dias'],['90d','Últimos 90 dias']],state.repP)+'</select></div><div class="fld"><label for="repReg">Região</label><select id="repReg" data-bind="repReg">'+opts(regOpts,state.repReg)+'</select></div></div>';
  return '<section class="card">'+ct('Comparativo','Período atual contra o período anterior de mesma duração')+ctl+
   '<div class="scroll"><table class="tbl" style="min-width:640px"><thead><tr><th>Regional</th><th class="r">Ocorrências</th><th class="r">Período anterior</th><th class="r">Variação</th><th class="r">Cobertura</th><th class="r">Disponibilidade</th></tr></thead><tbody>'+body+tot+'</tbody></table></div>'+
   '<div style="display:flex;flex-wrap:wrap;gap:10px"><button type="button" class="btn red hv" data-act="export">Exportar CSV</button><button type="button" class="btn ghost hv" data-act="copycsv">Copiar CSV</button></div>'+
   '<div class="msg" role="status" aria-live="polite">'+esc(state.csvmsg)+'</div>'+(state.csv?'<pre class="csv" tabindex="0" aria-label="Prévia do CSV">'+esc(state.csv)+'</pre>':'')+'</section>';
}
function buildCSV(){
  var out=['Regional;Ocorrencias;Periodo anterior;Variacao (%);Cobertura (%);Disponibilidade (%)'];
  repRows().forEach(function(r){out.push([r.k,r.cur,r.prev,(r.prev?((r.cur/r.prev-1)*100).toFixed(1).replace('.',','):''),Math.round(r.al/r.est*100),r.av].join(';'))});
  return out.join('\n');
}

/* ---------- 01 Dashboard (visão geral) ---------- */
var SHORT=[['ocorrencias','chart','Ocorrências por período','Evolução por intervalo'],['cobertura','target','Cobertura por regional','Alocadas sobre a demanda'],['mapa','pin','Mapa de demanda','Concentração por regional'],['viaturas','car','Gestão de viaturas','Cadastro e status operacional'],['recursos','flow','Distribuição de recursos','Demanda x recursos'],['relatorios','doc','Relatórios','Comparativos e exportação']];
function kpiComp(){
  var L=VEH.filter(function(v){return !vAvail(v.st)}),
   head='<div class="kh"><div class="lab">Recursos comprometidos</div><span class="ico">'+ic('alert')+'</span></div>';
  if(!L.length)return '<div class="kpi">'+head+'<div style="display:flex;align-items:baseline;gap:8px"><span class="big">0</span><span class="unit">viaturas</span></div><div class="b">Nenhuma viatura indisponível</div><div class="s">Todas as '+VEH.length+' viaturas em operação</div></div>';
  var one=L.length===1;
  return '<div class="kpi">'+head+L.map(function(v,i){
    return '<div style="display:flex;flex-direction:column;gap:2px;'+(one||!i?'':'border-top:1px solid var(--line);padding-top:8px')+'"><span class="big" style="font-size:'+(one?'40px':'26px')+'">'+esc(v.id)+'</span><span class="b" style="color:var(--red)">'+esc(rpMotivo(v))+'</span></div>'}).join('')+

function vDashboard(){

function toggleMenu(btn){
  var sm=$('#submenu');

  sm.innerHTML=MENU[+btn.getAttribute('data-g')].sub.map(function(x){return '<button type="button" class="si" data-act="nav" data-v="'+x[0]+'"><span class="sit">'+x[1]+'</span><span class="sid">'+x[2]+'</span></button>'}).join('');sm.hidden=false;btn.setAttribute('aria-expanded','true');markMenu(state.view);

  sm.style.left=Math.max(8,Math.min(r.left,window.innerWidth-w-8))+'px';

function markMenu(v){
  
  Array.prototype.forEach.call(document.querySelectorAll('.mi,.si'),function(b){
    var on;if(b.getAttribute('data-act')==='menu'){on=MENU[+b.getAttribute('data-g')].sub.some(function(x){return x[0]===v})}else on=b.getAttribute('data-v')===v;
    if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
}

function enter(){
  var el=$('#lg');if(el)el.hidden=true;document.querySelector('.app').hidden=false;
  buildMenu();state.view=home();
  try{location.hash=state.view}catch(e){}
  render();window.scrollTo(0,0);
}
document.addEventListener('submit',function(e){
  if(e.target.id!=='lform')return;e.preventDefault();
  var id=$('#l_id').value.trim().toUpperCase(),pw=$('#l_pw').value,bad='Identificação ou senha inválidas.';
  if(id===ACC.admin.id&&pw===ACC.admin.pw)sess={role:'admin'};
  else if(pw===ACC.pol.pw&&VEH.some(function(v){return v.id===id}))sess={role:'pol',vid:id};
  else{showLogin(bad);return}
  try{sessionStorage.setItem('pi_sess',JSON.stringify(sess))}catch(x){}
  enter();
});
document.addEventListener('click',function(e){
  var pt=e.target.closest('[data-act="pwtoggle"]');if(pt){var f=$('#l_pw');f.type=f.type==='password'?'text':'password';return}
  if(!e.target.closest('[data-act="logout"]'))return;
  sess=null;try{sessionStorage.removeItem('pi_sess')}catch(x){}
  closeMenu();showLogin('');
});

HEAD.p_inicio=['P1','Início','Sua viatura, a faixa horária atual e as próximas atividades do turno.'];
HEAD.p_mapa=['P2','Mapa de demanda','Prioridade por hexágono de 200 m e rotas das 8 viaturas em cada faixa horária.'];
HEAD.p_cartao=['P3','Cartão-programa','Horários, rota e etapas do serviço.'];
HEAD.p_ocorr=['P4','Ocorrências','Consulta geral por região e período.'];
var PMENU=[['p_inicio','Início','grid'],['p_mapa','Mapa','pin'],['p_cartao','Cartão-programa','doc'],['p_ocorr','Ocorrências','flow']];
state.pPer='30d';state.pReg='all';
function kp(l,v,s){return '<div class="kpi"><div class="lab">'+l+'</div><div class="b" style="font-size:20px;font-family:var(--f-disp);color:var(--navy)">'+esc(v)+'</div><div class="s">'+s+'</div></div>'}
function pMapa(){
  var v=myVeh(),L=regs().list,mx=Math.max.apply(null,L.map(function(r){return r.alloc})),mn=Math.min.apply(null,L.map(function(r){return r.alloc}));
  var t=L.map(function(r){var c=LV[lvl(r.alloc,mn,mx)],me=v&&v.lot===r.n;return '<div class="tile" style="background:'+c.bg+';color:'+c.fg+(me?';outline:3px solid var(--gold)':'')+'"><b>'+esc(r.n)+(me?' · você':'')+'</b><span>'+r.alloc+' viaturas<br><small>demanda estimada: '+r.est+'</small></span></div>'}).join('');
  var lg=LV.map(function(c){return '<span style="display:inline-flex;align-items:center;gap:6px;margin-right:12px;font-size:13px"><i style="width:14px;height:14px;border-radius:4px;background:'+c.bg+';border:1px solid var(--line)"></i>'+c.n+'</span>'}).join('');
  return '<section class="card">'+ct('Viaturas por regional','Cor: quantidade de viaturas alocadas. Contorno dourado: sua região.')+'<div class="tiles">'+t+'</div><div>'+lg+'</div><div class="note">Não há coordenadas cadastradas: as viaturas são mostradas por regional, sem posição exata.</div></section>';
}
function pOcorr(){
  var tot=MAPP['12m'],per=state.pPer,base={dia:'Hoje','7d':'Últimos 7 dias','30d':'Últimos 30 dias','90d':'Últimos 90 dias'};
  var T=PER[per].values.reduce(function(a,b){return a+b},0),v=myVeh();

    PL0.escala.forEach(function(e){var ids=PL0.rotas[e[0]][e[1]][0],ph=[];PL0.rotas[e[0]][e[1]][1].forEach(function(q){for(var i=0;i<q[1];i++)ph.push(q[0])});
      var vs=new Set();ids.forEach(function(x,k){if(ph[k]!=='D')vs.add(x)});
      VEH[e[0]][e[1]]=e[2];ANC[e[0]].push(e[2]);
      ROT[e[0]+'|'+e[1]]={src:'orig',a:e[2],visited:vs,R:e[3]*1000,bm:e[4],km:e[6],modo:e[4]>0?'BASE':'ZONA',desl:0,e:e}});

  function cobertura(P){
    var out=[];

      var tot=X.TH[h],cov=0;uni.forEach(function(i){cov+=X.SH[h][i]});
      out.push({h:h,uni:uni,tot:tot,cov:cov,pct:tot?Math.round(1000*cov/tot)/10:0})}
    return out}
  function run(ind){
    init();
    var O=origPlan();
    if(!BASEJ)BASEJ=planejar([],null);
    var P=planejar(ind,BASEJ);
    Object.keys(P.ROT).forEach(function(k){var b=BASEJ.ROT[k],r=P.ROT[k];if(b&&sameInp(b.inp,r.inp)&&O.ROT[k]){P.ROT[k]=O.ROT[k]}else r.src='js'});
    var cb=cobertura(O),cc=cobertura(P),imp=[],h,v,N=X.N;
    for(h=0;h<24;h++){
      var perd=O.ANC[h].filter(function(a){return !cc[h].uni.has(a)}),cbk=0,cck=0;
      cb[h].uni.forEach(function(i){if(X.SH[h][i]>0)cbk++});cc[h].uni.forEach(function(i){if(X.SH[h][i]>0)cck++});
      var indis=[];for(v=0;v<NV;v++)if(!P.disp[h][v])indis.push(v);
      imp.push({h:h,cls:X.CLS[h],K:P.K[h],indis:indis,cb:cb[h].pct,cc:cc[h].pct,dv:Math.round((cc[h].pct-cb[h].pct)*10)/10,cbk:cbk,cck:cck,perd:perd})}
    var totS=0,covB=0,covC=0;for(h=0;h<24;h++){totS+=cb[h].tot;covB+=cb[h].cov;covC+=cc[h].cov}
    var afet=imp.filter(function(x){return x.K<NV}),worst=null;afet.forEach(function(x){if(!worst||x.dv<worst.dv)worst=x});
    function crit(C,hs){var n=0;hs.forEach(function(x){C[x.h].uni.forEach(function(i){if(X.niv[i]>=2&&X.SH[x.h][i]>0)n++})});return n}
    var ctot=0;afet.forEach(function(x){for(var i=0;i<N;i++)if(X.niv[i]>=2&&X.SH[x.h][i]>0)ctot++});
    var resumo={covB:Math.round(1000*covB/totS)/10,covC:Math.round(1000*covC/totS)/10,faixas:afet.length,minK:Math.min.apply(null,P.K),worst:worst,queda:afet.length?Math.round(afet.reduce(function(a,x){return a+x.dv},0)/afet.length*10)/10:0,crit:{total:ctot,orig:crit(cb,afet),cen:crit(cc,afet)}};
    /* cobertura por região no dia */
    var rg={};
    for(var i=0;i<N;i++){var nm=plReg(i);if(!rg[nm])rg[nm]={n:nm,tot:0,cb:0,cc:0,hex:0};rg[nm].hex++;for(h=0;h<24;h++)rg[nm].tot+=X.SH[h][i]}
    for(h=0;h<24;h++){cb[h].uni.forEach(function(i){rg[plReg(i)].cb+=X.SH[h][i]});cc[h].uni.forEach(function(i){rg[plReg(i)].cc+=X.SH[h][i]})}
    var regs=Object.keys(rg).map(function(k){var r=rg[k];return {n:r.n,hex:r.hex,tot:r.tot,pb:r.tot?Math.round(1000*r.cb/r.tot)/10:0,pc:r.tot?Math.round(1000*r.cc/r.tot)/10:0}}).sort(function(a,b){return a.pc-b.pc});
    /* alterações por viatura e faixa */
    var chg=[];
    for(v=0;v<NV;v++)for(h=0;h<24;h++){
      var k=h+'|'+v,o=O.ROT[k],r=P.ROT[k],lab,tp;
      if(!r){lab='Indisponível (era âncora #'+(o.a+1)+')';tp='ind'}

      else if(o&&r.a===o.a){lab='Rota ajustada (mesma âncora)';tp='adj'}
      else{lab='Nova âncora: #'+(o.a+1)+' → #'+(r.a+1);tp='new'}
      if(r&&r.src==='js'&&r.orf&&r.orf.length)lab+=' · cobre também a área da âncora '+r.orf.map(function(o){return '#'+(o+1)+' ('+plReg(o)+')'}).join(', ');
      if(r&&r.src==='js'&&r.desl>0.5&&h>0&&!P.disp[h-1][v]){lab+=' · retorno de empenho: deslocamento de '+Math.round(r.desl)+' min até a âncora';if(tp==='ok')tp='adj'}

  /* converte o plano para as estruturas usadas pelas telas (mapa, cartão-programa, pontos de parada) */
  function toSite(R){

    Object.keys(P.ROT).forEach(function(k){var hv=k.split('|').map(Number),hh=hv[0],vv=hv[1],r=P.ROT[k];
      if(r.src==='orig'){rot[hh][vv]=PL0.rotas[hh][vv];esc.push(r.e.slice());
        var pr=PD0.pf.filter(function(x){return x[0]===hh&&x[1]===vv})[0];if(pr)pf.push(pr.slice());if(PD0.pat[k])pat[k]=PD0.pat[k];return}
      var ids=r.seq.map(function(q){return q[0]}),ph=[],rle=[];
      r.seq.forEach(function(q){var c=q[1]==='DESLOCAMENTO'?'D':q[1]==='BASE'?'B':'P';if(rle.length&&rle[rle.length-1][0]===c)rle[rle.length-1][1]++;else rle.push([c,1])});
      rot[hh][vv]=[ids,rle];
      var pts=0;r.visited.forEach(function(i){pts+=X.SH[hh][i]});
      esc.push([hh,vv,r.a,r.R/1000,Math.round(r.bm),r.visited.size,Math.round(r.km*10)/10,pts,X.SH[hh][r.a]]);
      pf.push([hh,vv,r.a+1,Math.round(r.bm),r.R/1000,X.SH[hh][r.a],insMap[r.a+1]===undefined?1:insMap[r.a+1]]);
      var seen={},pp=[];
      r.seq.forEach(function(q,i){if(q[1]!=='PATRULHA')return;var first=seen[q[0]]?0:1;seen[q[0]]=1;pp.push([i+1,q[0]+1,Math.round(q[2]),first,Math.round(Math.min.apply(null,[r.a].concat(r.orf||[]).map(function(c){return dist(q[0],c)})))])});
      pat[k]=pp});
    esc.sort(function(a,b){return a[0]-b[0]||a[1]-b[1]});pf.sort(function(a,b){return a[0]-b[0]||a[1]-b[1]});
    PL.rotas=rot;PL.escala=esc;PD.pf=pf;PD.pat=pat;
    var cob=[];
    for(h=0;h<24;h++){var c=R.cc[h],x=PL0.horas[h].slice();x[3]=Math.round(c.cov*10)/10;x[4]=c.pct;x[5]=c.uni.size;PL.horas[h]=x}
    var dayVis=new Set();R.cc.forEach(function(c){c.uni.forEach(function(i){dayVis.add(i)})});
    [3,2,1,0].forEach(function(L,j){var tot=0,vv=0;for(var i=0;i<X.N;i++)if(X.niv[i]===L){tot++;if(dayVis.has(i))vv++}cob.push([PL0.cob[j][0],tot,vv,tot?Math.round(1000*vv/tot)/10:0])});
    PL.cob=cob;dRows.c=null}
  function restore(){
    if(!PL0)return;
    PL.rotas=JSON.parse(JSON.stringify(PL0.rotas));PL.escala=JSON.parse(JSON.stringify(PL0.escala));PL.horas=JSON.parse(JSON.stringify(PL0.horas));PL.cob=JSON.parse(JSON.stringify(PL0.cob));

function vSet(id,st){

document.addEventListener('click',function(e){
